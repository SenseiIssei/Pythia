[package]
name = "pythia-cli"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
description = "Pythia on the command line: watch and steer a running engine, or start one."
license = "MIT"

[[bin]]
name = "pythia"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
