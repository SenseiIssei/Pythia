[package]
name = "pythia-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Pythia engine core: strategies, risk, connectors, market data, signals."

[dependencies]
pythia-ml = { path = "../pythia-ml" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# Exchange request signing (Kraken/Binance/Bybit/OKX all HMAC their payloads).
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# Coinbase Advanced Trade is the one venue that signs with a key pair instead:
# an ES256 (ECDSA P-256 + SHA-256) JWT per request. RustCrypto's p256, with PEM
# parsing for the "EC PRIVATE KEY" file Coinbase hands out.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
