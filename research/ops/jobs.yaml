# Every scheduled Pythia job, in one table. Times are UTC.
#
# This file is the only place a schedule is written down. After a change:
#
#   install -m 644 research/ops/jobs.yaml /opt/pythia-ops/jobs.yaml
#   python3 /opt/pythia-ops/jobs.py validate
#   python3 /opt/pythia-ops/jobs.py render        # rewrites /etc/cron.d/pythia-jobs
#
# (research/ops/deploy_ops.sh does all three.) Fields per job:
#
#   name          lower case, digits, dashes; the log is /var/log/pythia/<name>.log
#   description   one line, shown in the status and the cron file
#   schedule      5-field cron, quoted. Leave it out and set depends_on to run
#                 the job right after its dependencies succeed (a chain).
#   kind          lab (the pythia-lab image, lab code mounted at /app, the
#                 default), image (another image, no code mount) or host (a
#                 shell command on the host)
#   image         for kind image
#   command       what runs; in a container it is split like a shell would,
#                 without a shell (use sh -c '...' for one)
#   resources     {cpus, memory} for docker run
#   timeout       hard limit (90s, 45m, 3h); the run is killed past it
#   grace         how long past the schedule plus timeout before the job is late (15m)
#   lock          lock name(s); jobs sharing a lock never overlap (default: the job's name)
#   lock_wait     how long to wait for a busy lock before skipping this run (0)
#   depends_on    jobs that must have succeeded within depends_within (20h) and
#                 not be running; otherwise the run is recorded as blocked
#   enabled       false keeps the entry but renders it commented out
#   network, env, env_file, volumes   passed to docker run (env_file is read
#                 by the runner for host jobs; one file or a list, a name
#                 ending in ? is optional and skipped when missing)
#   alert         false: no Telegram/webhook post on this job's first failure
#   replaces      the hand-written /etc/cron.d file(s) that ran this job before
#                 the table. While such a file exists the job stays commented
#                 out in the rendered cron file (it never runs twice);
#                 `render --prune-legacy` moves the files to
#                 /etc/pythia/cron-legacy/ and hands the jobs to the table.
#
# The heavy nightly jobs share the lock `heavy` and wait for each other, so
# two of them never compete for memory even when one runs long.

paths:
  data: /srv/pythia-data
  code: /opt/pythia-lab
  ops: /opt/pythia-ops
  logs: /var/log/pythia
  locks: /run/lock/pythia
  python: /usr/bin/python3
  cron_dir: /etc/cron.d
  alert_env: /etc/pythia/alerts.env
  min_free_gb: 20
  log_max_mb: 10
  log_keep: 5

defaults:
  kind: lab
  image: pythia-lab
  timeout: 1h
  resources: {cpus: 1, memory: 2g}

jobs:
  # ---------------------------------------------------------------- nightly pipeline
  - name: backfill
    description: history backfill, 20 lab coins, every USDT pair and perp
    schedule: "30 3 * * *"
    kind: image
    image: pythia-recorder
    command: sh -c 'python -m recorder.backfill && python -m recorder.backfill --only klines_1h_all --jobs 48 --parallel 48 && python -m recorder.backfill --only um_all --jobs 48 --parallel 48'
    resources: {cpus: 3, memory: 2g}
    timeout: 3h
    lock: heavy
    lock_wait: 1h
    replaces: pythia-backfill

  - name: paper
    description: momentum paper books and engine signals
    schedule: "0 4 * * *"
    command: python -m lab.paper.tsmom
    resources: {cpus: 2, memory: 4g}
    timeout: 45m
    lock: heavy
    lock_wait: 2h
    replaces: pythia-paper

  - name: paper-review
    description: paper against backtest review, after the momentum books
    depends_on: [paper]
    command: python -m lab.paper.review
    timeout: 15m
    replaces: pythia-paper

  # paper-families writes breakout_top10, the book whose live twin trades real money, so it and
  # paper-live-copy run from the owner's own copy of the lab (/opt/pythia-live, research/ops/
  # deploy_live.sh, read only), never from /opt/pythia-lab, which the research agent's rounds deploy.
  - name: paper-families
    description: sweep candidates as paper books (momentum, tranches, breakout)
    schedule: "15 4 * * *"
    command: python -m lab.paper.families
    code: false
    volumes: [/opt/pythia-live:/app:ro]
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 2, memory: 6g}
    timeout: 1h
    lock: heavy
    lock_wait: 2h
    replaces: pythia-paper-families

  # The live twins of the books a real-money autopilot runs (lab/paper/live_copy.py): the same
  # signal under a strategy id of its own, so paper autopilots keep the original.
  - name: paper-live-copy
    description: live twins of the books a real-money autopilot runs, after the books are written
    depends_on: [paper-families]
    command: python -m lab.paper.live_copy
    code: false
    volumes: [/opt/pythia-live:/app:ro]
    timeout: 5m

  # EXPERIMENT, paper only (docs/ONCHAIN.md): breakout_top10_live's weights held in a Solana
  # wallet on paper, filled through Jupiter's public quotes, against Kraken's costs. Reads the
  # twin's signal, signs and sends nothing. The hourly mark only marks.
  - name: onchain-paper
    description: EXPERIMENT on-chain paper book, breakout_top10_live through Jupiter quotes, after its twin is written
    depends_on: [paper-live-copy]
    command: python -m lab.onchain.book
    resources: {cpus: 1, memory: 1g}
    timeout: 20m
    lock: onchain
    lock_wait: 10m

  # breakout_top10's rule choosing only among the coins with a Solana mint (lab.onchain.sol_book),
  # on the panel paper-families just rebuilt into lab-cache: writes signals/onchain_breakout_sol
  # (what the on-chain live service trades when its ack names the book), then steps its paper
  # twin through Jupiter quotes like onchain-paper. Signs and sends nothing.
  - name: onchain-sol-book
    description: EXPERIMENT on-chain book onchain_breakout_sol, breakout_top10's rule among the Solana coins, targets and paper twin
    depends_on: [paper-families, onchain-paper]
    command: python -m lab.onchain.sol_book
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 1, memory: 3g}
    timeout: 30m
    lock: [heavy, onchain]
    lock_wait: 2h

  - name: onchain-mark
    description: EXPERIMENT on-chain paper book, hourly mark at Jupiter prices, no trade
    schedule: "40 * * * *"
    command: python -m lab.onchain.book --mark
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    grace: 30m
    lock: onchain
    alert: false

  # Pre-registered forward shadow (results/exit_shadow_prereg.md): the M14 exit
  # and a 40-day time stop on the crypto books, decided on the panel the paper
  # books just rebuilt, written before the outcome and scored as days pass.
  # Nothing reads it to trade. Deploy the lab code (deploy_lab.sh) first.
  - name: exit-shadow
    description: forward shadow of the M14 exit and the 40-day time stop on the crypto books, decisions written before the outcome, never traded
    depends_on: [paper-families]
    command: python -m lab.paper.exit_shadow
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 2, memory: 6g}
    timeout: 30m
    lock: heavy
    lock_wait: 2h

  - name: paper-memes
    description: EXPERIMENT memecoin paper books (rotation, tsmom) and their experimental engine signals
    schedule: "30 4 * * *"
    command: python -m lab.paper.memes
    resources: {cpus: 1, memory: 1g}
    timeout: 20m
    grace: 30m

  - name: paper-trend4h
    description: EXPERIMENT 4h trend with pullback maker entries, hourly fills and exits, experimental signal
    schedule: "7 * * * *"
    command: python -m lab.paper.trend4h
    resources: {cpus: 1, memory: 1g}
    timeout: 15m
    grace: 30m

  # Proposed by the gated_btc study (results/gated_btc.md): BTC only while it
  # closes above its 200-day average, an experiment (failed deflation, below
  # plain BTC on Sharpe from 2024). Added disabled; switch on (enabled: true,
  # then deploy_ops.sh) once the owner wants its forward record. Its signal is
  # experimental and autopilot-only either way: no autopilot runs it unless one
  # names lab:btc_gated.
  - name: paper-btc-gated
    description: EXPERIMENT BTC above its 200-day average, full weight or cash, and its experimental engine signal
    schedule: "35 4 * * *"
    command: python -m lab.paper.btc_gated
    resources: {cpus: 1, memory: 1g}
    timeout: 15m
    grace: 30m

  # Proposed by xs_factors and kr_premium_xs (results/crypto_own_prereg.md): tsmom_tranches
  # without the worst third by 28-day MAX, and without the worst third by the coin's own
  # Korean premium (needs flow-collect's Upbit markets). Both passed the gates, both
  # improvements failed deflation, so they are experiments. Added disabled; switch on
  # (enabled: true, then deploy_ops.sh) once the owner wants their forward records. Their
  # signals are experimental and autopilot-only: no autopilot runs one unless it names
  # lab:tsmom_tranches_lowmax or lab:tsmom_tranches_lowkr.
  - name: paper-tranches-filtered
    description: EXPERIMENT tsmom_tranches with a MAX filter and with a Korean premium filter, two shadow paper books and their experimental engine signals
    schedule: "25 4 * * *"
    command: python -m lab.paper.tranches_filtered
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 2, memory: 6g}
    timeout: 1h
    lock: heavy
    lock_wait: 2h

  # The SPY sleeve of the Crypto + SPY forward test (results/equity_sleeve_prereg.md):
  # a lab book of US shares that is always 100 % SPY. It runs every weekday and
  # publishes a new signal only on the first run in a calendar month, so the
  # engine brings the sleeve back to its share once a month. Explicit only: no
  # auto pick takes it, only an autopilot that names lab:spy_hold runs it.
  - name: paper-spy-hold
    description: SPY bought and held, the monthly signal of the forward test's equity sleeve
    schedule: "20 14 * * 1-5"
    command: python -m lab.paper.spy_hold
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    grace: 30m

  - name: paper-m4
    description: M4 shadow paper book, market-neutral on perps
    schedule: "45 4 * * *"
    command: python -m lab.paper.m4_ls
    env: {PYTHIA_CACHE: /data/lab-cache}
    resources: {cpus: 4, memory: 8g}
    timeout: 1h
    lock: heavy
    lock_wait: 2h
    replaces: pythia-paper-m4

  # M4's registered pick reg7n (results/m4_residual.md), an experiment (passes
  # the residual test, fails deflation), on the liquid perps Kraken Futures
  # lists. The engine's perps demo autopilot ("M4 perps (demo)") trades this
  # signal; it is experimental and autopilot-only, never live.
  - name: paper-m4-perps
    description: M4 reg7n perps book on the coins Kraken Futures lists, and its experimental engine signal (autopilot only)
    schedule: "15 5 * * *"
    command: python -m lab.paper.m4_perps
    env: {PYTHIA_CACHE: /data/lab-cache}
    resources: {cpus: 4, memory: 8g}
    timeout: 1h
    lock: heavy
    lock_wait: 2h

  # Funding carry on perps (results/funding_carry.md), an experiment (passes its
  # registered gates and the residual after low vol and BTC, fails deflation),
  # on the liquid perps Kraken Futures lists. Its signal is
  # experimental and autopilot-only: no autopilot runs it unless one names
  # lab:funding_carry.
  - name: paper-funding-carry
    description: EXPERIMENT funding carry perps book (long the lowest, short the highest 7-day funding) and its experimental engine signal (autopilot only)
    schedule: "45 5 * * *"
    command: python -m lab.paper.funding_carry
    env: {PYTHIA_CACHE: /data/lab-cache}
    resources: {cpus: 4, memory: 8g}
    timeout: 1h
    lock: heavy
    lock_wait: 2h

  # The three market-neutral perps books held as one (results/
  # perps_neutral_portfolio.md), an experiment (passes its registered gates,
  # fails deflation). Reads the m4_perps and funding_carry signals, adds the
  # low-vol beta-neutral book from the sweep panel, ERC monthly. Its signal is
  # experimental and autopilot-only. Added disabled: switch on (enabled: true,
  # then deploy_ops.sh) only when the owner decides; nothing wires it into an
  # autopilot.
  - name: paper-perps-neutral
    description: EXPERIMENT one book from the M4, funding carry and low-vol perps books (ERC monthly) and its experimental engine signal (autopilot only)
    schedule: "15 6 * * *"
    command: python -m lab.paper.perps_neutral
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 2, memory: 6g}
    timeout: 30m
    lock: heavy
    lock_wait: 2h
    enabled: true

  # Kraken Futures hourly funding and mark prices (public, no key), kept beyond the
  # endpoint's one-year window for kraken_funding_gap (results/kraken_funding_gap.md).
  # Data only.
  - name: kraken-futures-collect
    description: Kraken Futures funding history and hourly marks for the Alpaca coins (data only)
    schedule: "5 6 * * *"
    command: python -m lab.collect.kraken_futures
    resources: {cpus: 1, memory: 1g}
    timeout: 30m

  - name: paper-ls
    description: market-neutral M2 paper book v1
    schedule: "30 5 * * *"
    command: python -m lab.paper.picks_ls
    env: {PYTHIA_M2_LOWVOL_SHADOW: "1"}
    resources: {cpus: 3, memory: 10g}
    timeout: 1h
    lock: heavy
    lock_wait: 3h
    replaces: pythia-paper-ls

  - name: paper-ls-v2
    description: market-neutral M2 paper book v2, after v1
    depends_on: [paper-ls]
    command: python -m lab.paper.picks_ls --v2
    env: {PYTHIA_M2_LOWVOL_SHADOW: "1"}
    resources: {cpus: 3, memory: 10g}
    timeout: 1h
    lock: heavy
    lock_wait: 3h
    replaces: pythia-paper-ls

  # X11 addendum: M2 without against M2 with the flow, positioning, trend and
  # risk inputs, ranked weekly before the outcome (results/model_upgrades.md).
  # Added disabled; switch on once lab.experiments.m2_v3 is deployed.
  - name: m2-v3-shadow
    description: weekly M2 v2 and v3 rankings written before the outcome and scored after 7 days, never traded
    schedule: "30 8 * * 1"
    command: python -m lab.experiments.m2_v3 --shadow
    env: {PYTHIA_CACHE: /data/lab-cache}
    resources: {cpus: 4, memory: 10g}
    timeout: 2h
    lock: heavy
    lock_wait: 3h

  - name: forward
    description: forward report, every paper book and autopilot against its backtest
    schedule: "15 6 * * *"
    command: python -m lab.paper.forward_report
    network: host
    timeout: 30m
    replaces: pythia-forward

  - name: learn
    description: learning loop, costs, evidence, challengers, digest
    schedule: "30 6 * * *"
    command: python -m lab.ops.learn
    network: host
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 4, memory: 8g}
    timeout: 5h
    lock: heavy
    lock_wait: 3h
    replaces: pythia-learn

  # Listed before notify on purpose: chained jobs run in table order, so the
  # digest reads today's readiness. notify does not depend on it, so a failed
  # readiness check never holds the digest back.
  - name: readiness
    description: real money readiness, every autopilot against the pre-registered rule (docs/LIVE-READINESS.md)
    depends_on: [learn]
    command: python -m lab.ops.readiness
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 15m

  # The morning digest after the learning loop is replaced by the briefing at 09:00 Berlin
  # (below); kept here, off, for `jobs.py run notify --force`.
  - name: notify
    description: daily digest to the operator, right after the learning loop (replaced by the briefing)
    depends_on: [learn]
    command: python -m lab.ops.notify
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 15m
    replaces: pythia-learn
    enabled: false

  # The morning briefing at 09:00 Europe/Berlin (lab.ops.briefing), to Telegram and Discord.
  # Cron runs in UTC, so it fires hourly through the morning and the job sends only in the
  # hour that is 9 o'clock in Berlin (07 UTC in summer, 08 UTC in winter), once a day.
  - name: briefing
    description: morning briefing at 09:00 Berlin, pump.fun, real money, paper, lab, cards, skins, coins, stocks, news, to Telegram and Discord
    schedule: "0 6-9 * * *"
    command: python -m lab.ops.briefing
    network: host
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 1g}
    timeout: 15m

  # Every real-money fill of a Kraken or Alpaca autopilot to Discord (the engine posts it to
  # Telegram itself): the bot's #konten and a DM, else the trades webhook. Does nothing
  # without PYTHIA_DISCORD_BOT_TOKEN (discord.env) or PYTHIA_DISCORD_WEBHOOK.
  - name: discord-live-fills
    description: real-money autopilot fills to Discord, read from the engines' state
    schedule: "*/2 * * * *"
    command: python -m lab.ops.notify --live-fills
    network: host
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 512m}
    timeout: 90s
    alert: false

  # What only the Discord bot carries (lab.ops.discord_feed): the forward report to
  # #paper-buecher, new study verdicts to #studien, model decisions to #modelle, new
  # headlines to #news. Reads files only; does nothing without PYTHIA_DISCORD_BOT_TOKEN.
  - name: discord-feed
    description: forward report, study verdicts, model decisions and news to the Discord bot's channels
    schedule: "*/10 * * * *"
    command: python -m lab.ops.discord_feed
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    alert: false

  - name: costs
    description: weekly cost calibration from the recorded books, report only
    schedule: "40 5 * * 0"
    command: python -m lab.experiments.costs
    resources: {cpus: 2, memory: 8g}
    timeout: 1h
    lock: heavy
    lock_wait: 3h
    replaces: pythia-costs

  # ---------------------------------------------------------------- host jobs
  - name: pumpfun-live-watch
    description: watches the real-money pump.fun bot every two minutes (container, status, gate, test gate, stuck positions) and posts at once when it does not trade as it should
    schedule: "*/2 * * * *"
    kind: host
    command: /usr/bin/python3 /opt/pythia-ops/pumpfun_live_watch.py
    timeout: 2m
    alert: false

  # Our own wallet's history for the app's Wallet tab: getSignaturesForAddress and getTransaction
  # for its public address, parsed into reports/onchain/history.json. Read only; quiet until the
  # wallet tool made a wallet. The live service reads it again after every swap.
  - name: onchain-history
    description: our on-chain wallet's history from the chain (deposits, swaps, fees, failures) for the Wallet tab, read only
    schedule: "*/5 * * * *"
    command: python -m lab.onchain.history
    resources: {cpus: 1, memory: 512m}
    timeout: 4m
    grace: 15m
    alert: false

  # Speed and cost of every on-chain swap against the pump.fun bot's execution and Kraken's fees.
  - name: onchain-execution
    description: reports/onchain/execution.md, the on-chain trader's measured send, land, fees and cost against pump.fun and Kraken
    schedule: "25 6 * * *"
    command: python -m lab.onchain.execution
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    alert: false

  # EXPERIMENT, paper only (docs/ONCHAIN-MEME.md): three pre-registered meme rules, a paper book each
  # through real Jupiter quotes, every coin through the per-coin safety check first. Light; signs nothing.
  - name: onchain-meme
    description: EXPERIMENT meme rules on paper through Jupiter quotes (candidates, safety check, entries, exits), every 2 minutes
    schedule: "*/2 * * * *"
    command: python -m lab.onchain.meme
    resources: {cpus: 0.5, memory: 512m}
    timeout: 100s
    grace: 10m
    lock: onchain-meme
    alert: false

  - name: onchain-meme-proof
    description: the meme rules' pre-registered paper proof, reports/onchain_meme/proof.json (the live gate reads it)
    schedule: "35 6 * * *"
    command: python -m lab.onchain.meme --proof
    resources: {cpus: 1, memory: 1g}
    timeout: 10m
    lock: onchain-meme
    lock_wait: 5m
    alert: false

  - name: onchain-live-watch
    description: watches the real-money on-chain trader every two minutes (container, status, gate, simulation, ledger against chain, frozen accounts, hanging swaps) and posts at once; quiet until the owner ever started it
    schedule: "*/2 * * * *"
    kind: host
    command: /usr/bin/python3 /opt/pythia-ops/onchain_live_watch.py
    timeout: 2m
    alert: false

  - name: health
    description: health check of every job, container, stream, book and the disk
    schedule: "7 * * * *"
    kind: host
    command: /opt/pythia-ops/system_health.sh
    timeout: 10m
    alert: false
    replaces: pythia-health

  - name: notify-pending
    description: a digest asked for through the engine API, if any
    schedule: "*/5 * * * *"
    command: python -m lab.ops.notify --pending
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 512m}
    timeout: 4m
    alert: false
    replaces: pythia-notify-pending

  # The research agent (research/ops/agent/, README "Research agent"): Claude Code in its own
  # container on the Claude API, as an unprivileged user, no git key, no Docker socket, no
  # /etc/pythia, the data folder read only, one output folder of its own. Its commits come out
  # as patches; guard.py lets through only the research folders on its allow list, and only a
  # round that passes every check is pushed, merged and deployed. A held round stays root-only
  # on the server. The weekly round runs the director's fresh drafts; the daily care fixes failed jobs.
  - name: agent-research
    description: weekly research round by the agent, director drafts to registered studies, merged and deployed when the guard passes
    schedule: "0 13 * * 0"
    kind: host
    command: /opt/pythia-ops/agent/run_agent.sh research
    timeout: 7h
    lock: agent
    enabled: false
    # off since 2026-10-24: the API credit is used up and not topped up again (the owner)

  - name: agent-care
    description: daily care by the agent, failed jobs fixed with tests, the live bot and the books checked, a short report
    schedule: "15 8 * * *"
    kind: host
    command: /opt/pythia-ops/agent/run_agent.sh care
    timeout: 2h
    lock: agent
    enabled: false
    # off since 2026-10-24: the API credit is used up and not topped up again (the owner)

  - name: backup
    description: archive of engine state, model registry, paper books and ledgers, rotated
    schedule: "20 2 * * *"
    kind: host
    command: python3 /opt/pythia-ops/jobs.py backup
    timeout: 1h

  - name: prune
    description: retention rules of the datasets below
    schedule: "50 2 * * *"
    kind: host
    command: python3 /opt/pythia-ops/jobs.py prune
    timeout: 1h

  - name: weekly-report
    description: the weekly report with its chart, Sunday from 18:00 Europe/Berlin, posts once a week
    schedule: "5 16-21 * * 0"
    command: python -m lab.ops.notify --weekly
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 15m
    replaces: pythia-weekly

  # ---------------------------------------------------------------- models and the strategy factory
  - name: models
    description: model zoo, retrains what is due, shadow forecasts, drift, the Models page report
    schedule: "15 7 * * *"
    command: python -m lab.models.train --due
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 4, memory: 8g}
    timeout: 4h
    lock: heavy
    lock_wait: 6h
    replaces: pythia-models

  - name: factory-shadow
    description: strategy factory, daily forward shadow step on the panel paper-families cached
    schedule: "0 5 * * *"
    command: python -m lab.factory shadow --notify
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 1, memory: 2g}
    timeout: 30m
    replaces: pythia-factory

  - name: factory-weekly
    description: strategy factory, weekly search, held-back checks and digest; every trial in the ledger
    schedule: "30 7 * * 0"
    command: python -m lab.factory --notify
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 4, memory: 4g}
    timeout: 3h
    lock: heavy
    lock_wait: 6h
    replaces: pythia-factory
    # The owner switched it back on 2026-10-21 after the research director had
    # advised a pause: every run raises the trial pool and the noise bar.

  # ---------------------------------------------------------------- AI (Claude API, metered by the engine)
  # All of them call through the autopilot engine's POST /api/ai/complete,
  # which holds the key and the hard budget (docs/AI.md). Shadow only: nothing
  # they write sizes, places or vetoes an order or changes an autopilot. The
  # owner's questions in Telegram are a long-running container, not a job
  # (research/ops/README.md, "Questions in Telegram").
  - name: ai-brief
    description: daily AI brief (Sonnet, batch) over the full fact sheet, 7-day calls for BTC, ETH and the autopilots' coins, scored against a base rate and the momentum rule
    schedule: "20 6 * * *"
    command: python -m lab.ai.brief
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 45m

  - name: ai-critic
    description: daily strategy critic (Haiku, batch), each autopilot's last 24 hours of orders against its rules; posts only findings of medium or high severity, every finding logged and scored
    schedule: "40 6 * * *"
    command: python -m lab.ai.critic
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 45m

  - name: ai-director
    description: weekly research director (Opus, effort high, batch) over every study summary and the trial ledger, 3 to 5 pre-registration drafts in proposals/, never run by anything
    schedule: "0 11 * * 0"
    command: python -m lab.ai.director
    network: host
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 2g}
    timeout: 90m

  - name: ai-weekly
    description: weekly AI review (Sonnet, batch) of every study and live result, three proposed experiments in reports/ai/weekly.md, never run by anything
    schedule: "0 9 * * 0"
    command: python -m lab.ai.weekly
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 75m

  # X11 (results/model_upgrades.md). Added disabled; switch on (enabled: true,
  # then deploy_ops.sh) once the modules are deployed to /opt/pythia-lab.
  # Shadow only: nothing they write sizes, places or vetoes an order.
  - name: ai-analyst
    description: weekly Claude analyst (Sonnet, batch), ranks the Alpaca coins on the M2 v2 book's rebalance day, scored by rank IC like M2
    depends_on: [paper-ls-v2]
    command: python -m lab.ai.analyst
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 2g}
    timeout: 75m

  - name: news-collect
    description: crypto headlines from publisher RSS feeds (titles only), kept per UTC day for the news sentiment
    schedule: "10 */4 * * *"
    command: python -m lab.ai.news --collect
    resources: {cpus: 1, memory: 512m}
    timeout: 10m
    alert: false

  - name: ai-news
    description: daily Claude news sentiment (Haiku, batch) per Alpaca coin from yesterday's headlines, tested against M2 on its ranking days
    schedule: "25 0 * * *"
    command: python -m lab.ai.news
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 1g}
    timeout: 45m

  # ---------------------------------------------------------------- watchers and collectors
  - name: listings
    description: new listings on Alpaca, Binance, Coinbase, Kraken, then the listings paper book
    schedule: "*/10 * * * *"
    command: sh -c 'python -m lab.ops.listings && python -m lab.paper.listings_book'
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/alpaca-paper.env?']
    resources: {cpus: 1, memory: 512m}
    timeout: 8m
    grace: 15m
    replaces: pythia-listings

  - name: trending
    description: trending watcher, boosted tokens, gainers and volume surges, read only
    schedule: "*/15 * * * *"
    command: python -m lab.ops.trending
    env_file: /etc/pythia/alerts.env
    env: {PYTHIA_AGENT_OUT: /data/lab-cache}
    resources: {cpus: 1, memory: 512m}
    timeout: 10m
    grace: 20m
    replaces: pythia-trending

  - name: pumpfun
    description: pump.fun PAPER watcher, graduations via GeckoTerminal, marks via DexScreener, read only, no wallet
    schedule: "*/5 * * * *"
    command: python -m lab.paper.pumpfun
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 512m}
    timeout: 4m
    grace: 10m

  - name: pumpfun-report
    description: pump.fun paper books, daily report (reports/pumpfun) and its Telegram card
    schedule: "40 6 * * *"
    command: python -m lab.paper.pumpfun --report
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    lock: pumpfun
    lock_wait: 5m

  # The real-time pump.fun collector is not a scheduled job but the always-on container
  # pythia-pumpfun-rt (research/ops/README.md, "Real-time pump.fun lab"). These jobs watch it and use it.
  - name: pumpfun-rt-health
    description: real-time pump.fun collector wrote curve trades and its heartbeat in the last 10 minutes
    schedule: "*/10 * * * *"
    command: python -m lab.pumpfun_rt.health
    resources: {cpus: 1, memory: 256m}
    timeout: 2m
    grace: 10m

  # The live gate wants a successful dry run of the live strategy's venue within 24 hours
  # (docs/PUMPFUN-LIVE.md, step 7). This keeps it fresh: simulateTransaction only, nothing is
  # signed or sent, and the wallet file is never opened (the address comes from its .pub). A
  # failure (pump.fun changed its programs again) alerts, and the gate shuts buying by itself.
  # It runs the owner's live code copy (/opt/pythia-live, deploy_live.sh) and sees only the two
  # files it reads from /etc/pythia, the confirmation and the public address, never the folder.
  - name: pumpfun-live-simulate
    description: dry run of a buy and a buy-then-sell for the pump.fun live wallet (nothing signed or sent) so the live gate stays current
    schedule: "7 */6 * * *"
    command: python -m lab.pumpfun_rt.live_exec simulate
    env_file: /etc/pythia/pumpfun-live.env?
    code: false
    volumes: [/opt/pythia-live:/app:ro, /etc/pythia/pumpfun-live-ack:/etc/pythia/pumpfun-live-ack:ro, /etc/pythia/pumpfun-keypair.json.pub:/etc/pythia/pumpfun-keypair.json.pub:ro]
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    grace: 6h

  - name: onchain-live-simulate
    description: dry run of a swap through the guard and a simulation for the on-chain wallet (nothing signed or sent) so its 24 h gate stays current
    schedule: "37 */6 * * *"
    command: python -m lab.onchain.live_exec simulate
    env_file: /etc/pythia/onchain-live.env?
    code: false
    volumes: [/opt/pythia-live:/app:ro, /etc/pythia/onchain-live-ack:/etc/pythia/onchain-live-ack:ro, /etc/pythia/onchain-keypair.json.pub:/etc/pythia/onchain-keypair.json.pub:ro]
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    grace: 6h

  # Name categories first (Claude Haiku 5.5 through the engine's metered POST /api/ai/complete,
  # Batches, budget enforced there; a refusal is not a failure), then the study, then the retrain,
  # which posts the daily card. Paper research only: nothing here can trade.
  - name: pumpfun-rt-categories
    description: real-time pump.fun lab, yesterday's new token names into categories (Haiku, batch), cached per mint, model features only
    schedule: "20 6 * * *"
    command: python -m lab.pumpfun_rt.categorize
    network: host
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 2g}
    timeout: 45m
    lock: pumpfun-rt-cat

  - name: pumpfun-rt-study
    description: real-time pump.fun lab, PAPER, daily; 22 rules and the pipeline strategies replayed, the bar, live readiness, capture, decision rows, X14 early/exit rows and Y9 select rows for the retrain
    schedule: "50 6 * * *"
    command: python -m lab.pumpfun_rt.study
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 2, memory: 8g}
    timeout: 4h
    lock: pumpfun-rt
    lock_wait: 10m

  - name: pumpfun-rt-retrain
    description: real-time pump.fun lab, daily retrain after the study; purged walk-forward per label and feature set, X14 early detection and exit policies, Y9 select models, models for the shadow books, the daily card
    depends_on: [pumpfun-rt-study]
    depends_within: 6h
    command: python -m lab.pumpfun_rt.retrain
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 2, memory: 8g}
    timeout: 3h
    lock: pumpfun-rt
    lock_wait: 30m

  # Survey idea O9 (results/pumpfun_activity_prereg.md): the daily activity series from the
  # record, kept in reports/pumpfun_activity/series.csv after the record drops old days.
  # Forward only, nothing judged before 180 complete days. Added disabled; switch on
  # (enabled: true, then deploy_ops.sh) once lab.pumpfun_rt.activity is deployed.
  - name: pumpfun-activity
    description: pump.fun daily activity (creations, completions, migrations, curve SOL volume, traders, coverage), forward record for O9
    schedule: "15 6 * * *"
    command: python -m lab.pumpfun_rt.activity
    resources: {cpus: 1, memory: 4g}
    timeout: 30m
    lock: pumpfun-rt-activity

  - name: cs2-collect
    description: CS2 skins, Skinport snapshots and sales history, Steam prices for the watchlist
    schedule: "12 * * * *"
    command: python -m lab.collect.cs2
    resources: {cpus: 1, memory: 4g}
    timeout: 40m
    replaces: pythia-cs2

  - name: cs2-run
    description: CS2 models, alerts, the play-money portfolio and the board, after the collector
    depends_on: [cs2-collect]
    depends_within: 2h
    command: python -m lab.cs2.run
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 4g}
    timeout: 15m
    replaces: pythia-cs2

  # New, no hand-written cron file before it. The source file is rebuilt once
  # a day (13:25 UTC on 2026-10-15); the 20:40 run only catches a late rebuild
  # and is a no-op once the day is stored.
  - name: cs2-trends
    description: CS2 Steam market, the daily price snapshot (csgotrader's public file), trends, trend alerts and the summary card
    schedule: "40 14,20 * * *"
    command: sh -c 'python -m lab.collect.cs2 --steam-market && python -m lab.cs2.trends'
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 3g}
    timeout: 20m

  - name: flow-collect
    description: flow data, Coinbase and Upbit BTC, every Upbit KRW market and its warning flags, USD/KRW, stablecoin supply, Deribit DVOL and 25-delta skew, continues from what is stored
    schedule: "40 0 * * *"
    command: python -m lab.collect.flow
    resources: {cpus: 1, memory: 1g}
    timeout: 1h

  # attention_wiki's page views (Wikimedia REST API, keyless, about 360 small
  # requests a run at most 4 a second, a User-Agent naming the public repo).
  - name: wiki-collect
    description: English Wikipedia page views of the coins' articles and their redirects (attention_wiki), continues from what is stored
    schedule: "50 0 * * *"
    command: python -m lab.collect.wiki
    resources: {cpus: 1, memory: 1g}
    timeout: 30m

  # Added disabled; switch on (enabled: true, then deploy_ops.sh) once the
  # module is deployed to /opt/pythia-lab and its command is confirmed.
  - name: pokemon
    description: Pokemon cards, price snapshot (sealed products too), then studies, forecasts, the paper collection and card alerts
    schedule: "5 7 * * *"
    command: sh -c 'python -m lab.collect.pokemon --sealed && python -m lab.pokemon.daily'
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 2, memory: 6g}
    timeout: 2h
    replaces: pythia-pokemon

  # Polymarket (Y4, results/polymarket.md). PAPER ONLY: public read-only data, no wallet,
  # no key, no order. Added disabled; switch on (enabled: true, then deploy_ops.sh) once
  # lab/polymarket is deployed to /opt/pythia-lab. The daily run calls Claude Sonnet 5.5
  # through the engine's metered POST /api/ai/complete (Batches, budget enforced there,
  # about $0.30 a day at 300 markets); a refusal or an engine that is down only skips the
  # forecasts, the books still run.
  - name: polymarket-daily
    description: Polymarket PAPER books, snapshot of the open markets and books, Claude forecasts (Sonnet, batch), settle, step, score, report and card
    schedule: "15 5 * * *"
    command: python -m lab.polymarket.daily --forecast
    network: host
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 3g}
    timeout: 2h
    lock: polymarket
    lock_wait: 30m

  - name: polymarket-history
    description: Polymarket resolved markets and their price history, weekly, only what is new
    schedule: "30 1 * * 1"
    command: python -m lab.polymarket.collect --history
    resources: {cpus: 1, memory: 3g}
    timeout: 8h
    lock: polymarket-history

  - name: polymarket-study
    description: Polymarket study after the history, biases, the calibrated model against the market, the paper twin, the model the daily book uses
    depends_on: [polymarket-history]
    depends_within: 12h
    command: python -m lab.polymarket.study
    resources: {cpus: 4, memory: 10g}
    timeout: 4h
    lock: heavy
    lock_wait: 4h

  - name: retrain
    description: weekly retrain of the volatility model (M1), promoted only if better
    schedule: "0 5 * * 0"
    command: sh -c 'python -m lab.experiments.vol > /data/reports/vol_1h/run.log 2>&1'
    resources: {cpus: 4, memory: 8g}
    timeout: 3h
    lock: heavy
    lock_wait: 2h
    replaces: pythia-retrain

  - name: equities-studies
    description: equities studies refresh
    schedule: "0 23 * * 1-5"
    command: python -m lab.equities.run
    env_file: '/etc/pythia/alpaca-paper.env?'
    resources: {cpus: 2, memory: 6g}
    timeout: 3h
    lock: heavy
    lock_wait: 2h
    enabled: false

# Size and growth per dataset (paths under the data root). max_gb turns the
# dataset red in the health check; retention_days lets the prune job delete
# files older than that (by modification time, only those matching pattern).
# Datasets without retention_days are never deleted from.
datasets:
  - name: recorder-binance
    path: binance
    max_gb: 250
  - name: recorder-kraken
    path: kraken
    max_gb: 100
  - name: recorder-bybit
    path: bybit
    max_gb: 100
  - name: recorder-okx
    path: okx
    max_gb: 100
  - name: recorder-coinbase
    path: coinbase
    max_gb: 100
  - name: history
    path: hist
    max_gb: 300
  - name: lab-cache
    description: run caches and panels, rebuilt by the nightly jobs
    path: lab-cache
    max_gb: 80
  - name: models
    path: models
    max_gb: 20
  - name: paper
    path: paper
    max_gb: 5
  - name: reports
    description: dated report copies older than a year go; latest.* stay
    path: reports
    max_gb: 10
    retention_days: 365
    pattern: ["20??-??-??*.json", "20??-??-??*.md"]
  - name: signals
    path: signals
    max_gb: 2
    retention_days: 180
    pattern: ["20??-??-??.json"]
  - name: learn
    path: learn
    max_gb: 50
  - name: readiness
    description: the real money readiness record (one line a day) and the inflation cache; never deleted
    path: readiness
    max_gb: 1
  - name: recorder-binance-um
    path: binance_um
    max_gb: 100
  - name: spread
    path: spread
    max_gb: 20
  - name: factory
    description: the trial ledger and shadow books; never deleted
    path: factory
    max_gb: 5
  - name: cs2-snapshots
    description: hourly Skinport and Steam snapshots; the models read only cs2/daily, kept forever
    path: cs2
    max_gb: 40
    retention_days: 180
    pattern: ["[0-2][0-9][0-5][0-9].parquet"]
  - name: trending
    description: a snapshot every 15 minutes
    path: trending/snapshots
    max_gb: 10
    retention_days: 365
    pattern: ["*.parquet"]
  - name: listings
    path: listings
    max_gb: 2
  - name: ai
    description: the Claude API ledger, caps and the AI brief's predictions; never deleted
    path: ai
    max_gb: 1
  - name: flow
    description: daily flow data and the Deribit option snapshots; kept forever
    path: flow
    max_gb: 5
  - name: pumpfun-rt
    description: the real-time pump.fun record; the collector deletes whole days, oldest first, over PYTHIA_PF_BUDGET_GB (40)
    path: pumpfun_rt
    max_gb: 45
  - name: polymarket
    description: Polymarket resolved set, daily snapshots and books (the collector deletes book and snapshot days, oldest first, over PYTHIA_PM_BUDGET_GB, 6), the forecast ledgers and paper books (never deleted)
    path: polymarket
    max_gb: 8
  - name: job-runs
    description: the runner's own run records, by month
    path: _ops/runs
    max_gb: 1
    retention_days: 400
    pattern: ["*.jsonl"]

# The state that cannot be rebuilt from market data. Paths are under the
# data root. Archives go to dest (outside the data root) as
# pythia-state-<UTC time>.tar.gz with a .sha256 and a .json manifest, mode 600.
backup:
  dest: /srv/pythia-backup
  keep_daily: 7
  keep_weekly: 4
  include:
    - autopilot
    - server
    - models
    - paper
    - cs2/paper
    - signals
    - learn
    - readiness
    - costs
    - trials
    - factory
    - ai
    - live
    - pumpfun_rt/categories
    - polymarket/forecasts
    - polymarket/paper
    - polymarket/model
    - reports/forward/evidence.json
    - reports/forward/backtest
  # By file or folder name: caches the jobs rebuild (the zoo's panels, the
  # learning loop's sweep run caches) stay out of the archive.
  exclude: ["*.tmp", "*.lock", "*.part", "_data", "sweep"]
