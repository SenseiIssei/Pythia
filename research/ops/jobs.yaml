    schedule: "*/2 * * * *"
    command: python -m lab.collect.dexscreener
    resources: {cpus: 1, memory: 1g}
    timeout: 115s
    grace: 10m
    alert: false

  - name: dexscreener-health
    description: DexScreener archive ran and wrote snapshots in the last 12 minutes
    schedule: "*/10 * * * *"
    command: python -m lab.collect.dexscreener --health
