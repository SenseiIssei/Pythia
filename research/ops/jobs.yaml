    schedule: "50 6 * * *"
    command: python -m lab.experiments.dexscreener_d4
    resources: {cpus: 1, memory: 4g}
    timeout: 30m
    lock: heavy
    lock_wait: 1h

  # Candles (C1, research/lab/lab/candles): one candle API over every market Pythia looks at
