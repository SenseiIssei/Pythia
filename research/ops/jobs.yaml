  # the Binance archive under hist/ is read in place. About 0.5 GB a year, kept.
  - name: candles-live
    description: candles, the last day of Binance spot 1m from the public REST endpoint and 1m candles from the recorded Kraken trades, read only
    schedule: "*/10 * * * *"
    command: python -m lab.candles.live live
    resources: {cpus: 1, memory: 1g}
    timeout: 5m
    grace: 20m
    alert: false

  - name: candles-markets
    description: candles, GeckoTerminal 1h and 1d of the xStocks tokens, PAXG and the on-chain coins' Solana pools with liquidity (empty pools first, then where the last run stopped, then the stalest; 5 minutes and 40 calls a run, a 429 waits once then stops and keeps the rest for the next run), Yahoo of their underlyings, read only
    schedule: "7 * * * *"
    command: python -m lab.candles.live markets
    resources: {cpus: 1, memory: 512m}
    timeout: 8m
    grace: 1h
    alert: false

  - name: candles-health
    description: candles, the Binance REST fill and the Kraken candles under 30 minutes old, every Solana pool's 1h under 3 hours and 1d under 2 days (each missing or late pool listed)
    schedule: "*/10 * * * *"
    command: python -m lab.candles.store health
    resources: {cpus: 1, memory: 256m}
    timeout: 2m

  - name: candles-compact
    description: candles, merges each month's parts into its file, finished months final, then the gap report reports/candle_coverage_c1
    # 12:40, not 01:40: pumpfun-factory (01:00) holds the heavy lock about 1 h 45 min and the hour's wait ran
    # out first, so it never ran (2026-10-28)
    schedule: "40 12 * * *"
    command: sh -c 'python -m lab.candles.store compact && python -m lab.candles.store report'
    resources: {cpus: 1, memory: 2g}
    timeout: 30m
    lock: heavy
    lock_wait: 1h

  - name: pumpfun
    description: pump.fun PAPER watcher, graduations via GeckoTerminal, marks via DexScreener, read only, no wallet
    schedule: "*/5 * * * *"
    command: python -m lab.paper.pumpfun
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 512m}
    timeout: 4m
    grace: 10m

  - name: pumpfun-report
    description: pump.fun paper books, daily report (reports/pumpfun) and its Telegram card
    schedule: "40 6 * * *"
    command: python -m lab.paper.pumpfun --report
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    lock: pumpfun
    lock_wait: 5m

  # The real-time pump.fun collector is not a scheduled job but the always-on container
  # pythia-pumpfun-rt (research/ops/README.md, "Real-time pump.fun lab"). These jobs watch it and use it.
  - name: pumpfun-rt-health
    description: real-time pump.fun collector wrote curve trades and its heartbeat in the last 10 minutes
    schedule: "*/10 * * * *"
    command: python -m lab.pumpfun_rt.health
    resources: {cpus: 1, memory: 256m}
    timeout: 2m
    grace: 10m

  # The live gate wants a successful dry run of the live strategy's venue within 24 hours
  # (docs/PUMPFUN-LIVE.md, step 7). This keeps it fresh: simulateTransaction only, nothing is
  # signed or sent, and the wallet file is never opened (the address comes from its .pub). A
  # failure (pump.fun changed its programs again) alerts, and the gate shuts buying by itself.
  # It runs the owner's live code copy (/opt/pythia-live, deploy_live.sh) and sees only the two
  # files it reads from /etc/pythia, the confirmation and the public address, never the folder.
  - name: pumpfun-live-simulate
    description: dry run of a buy and a buy-then-sell for the pump.fun live wallet (nothing signed or sent) so the live gate stays current
    schedule: "7 */6 * * *"
    command: python -m lab.pumpfun_rt.live_exec simulate
    # on again 2026-10-29: the owner's 20 EUR live test (/root/pumpfun-start-20.sh on the server)
    env_file: /etc/pythia/pumpfun-live.env?
    code: false
    volumes: [/opt/pythia-live:/app:ro, /etc/pythia/pumpfun-live-ack:/etc/pythia/pumpfun-live-ack:ro, /etc/pythia/pumpfun-keypair.json.pub:/etc/pythia/pumpfun-keypair.json.pub:ro]
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    grace: 6h

  - name: onchain-live-simulate
    description: dry run of a swap through the guard and a simulation for the on-chain wallet (nothing signed or sent) so its 24 h gate stays current
    schedule: "37 */6 * * *"
    command: python -m lab.onchain.live_exec simulate
    env_file: /etc/pythia/onchain-live.env?
    code: false
    volumes: [/opt/pythia-live:/app:ro, /etc/pythia/onchain-live-ack:/etc/pythia/onchain-live-ack:ro, /etc/pythia/onchain-keypair.json.pub:/etc/pythia/onchain-keypair.json.pub:ro]
    resources: {cpus: 1, memory: 512m}
    timeout: 5m
    grace: 6h
    # back on 2026-10-26 with the long-term book (L1); read only, signs and sends nothing
    enabled: false
    # off since 2026-10-26: two weeks of paper for onchain_longterm first (the owner); on again when he arms it

  # Name categories first, then the study, then the retrain, which posts the daily card. Paper research only:
  # nothing here can trade. AI2 (results/categories_local_ai2_prereg.md): on the local models since 2026-10-29
  # (lab.ai.local: the owner's PC through the relay when it is online, else the VPS model, job local-llm), 25 names a
  # call, one at a time, most frequent first, within 4.5 hours (00:40 to at most 05:10 UTC, before the briefing asks
  # the same model at 06:00); names left stay unknown. Exits 1 only when no model answered at all.
  - name: pumpfun-rt-categories
    description: real-time pump.fun lab, yesterday's new token names into categories on the local model (the owner's PC through the relay, else the VPS model), every row names its model, model features only
    schedule: "40 0 * * *"
    command: python -m lab.pumpfun_rt.categorize
    network: host
    env_file: '/etc/pythia/local-llm.env?'
    resources: {cpus: 1, memory: 2g}
    timeout: 5h
    grace: 30m
    lock: pumpfun-rt-cat

  # AI2: the live classifier's one-at-the-buy call (livecat.ONE_TIMEOUT_S, 1.5 s) timed on 200 names of the last
  # day through the local chain, the share in time per model; reports/pumpfun_rt/livecat_timing.json. The lock of
  # the categories job, so they never run together. Measures only; nothing reads it but the owner.
  - name: pumpfun-rt-cat-timing
    description: real-time pump.fun lab, weekly, how often the local model names one coin's category within the live gate's 1.5 s, on 200 names of a day
    schedule: "30 11 * * 0"
    command: python -m lab.pumpfun_rt.livecat --timing
    network: host
    env_file: '/etc/pythia/local-llm.env?'
    resources: {cpus: 0.5, memory: 2g}
    timeout: 1h
    lock: pumpfun-rt-cat
    alert: false

  # R1 (research/lab/lab/pumpfun_rt/realistic.py): the realistic paper books' execution model refitted from the
  # live bot's orders of the last 7 days (read only), and the daily line "live vs realistic paper" for P_pool0_wait.
  # The collector re-reads reports/pumpfun_rt/realistic.json every 10 minutes.
  - name: pumpfun-rt-realistic
    description: real-time pump.fun lab, PAPER, daily; the realistic paper model refitted from the last 7 days of live orders, the calibration line live vs realistic paper
    schedule: "40 6 * * *"
    command: python -m lab.pumpfun_rt.realistic
    resources: {cpus: 1, memory: 1g}
    timeout: 10m

  # F3 (research/lab/lab/pumpfun_rt/factory.py): the pump.fun factory, nightly, no language model. Optuna's TPE over
  # the pipeline's building blocks, every trial a realistic book on the record (walk-forward by UTC day) and a 0.55 SOL
  # wallet bootstrap; the ledger data/pumpfun_rt/factory/ledger.jsonl only grows and deflates the bar; the last 2 days
  # held back for the night's top 3; the LightGBM settings of R2's labels (adopted by the daily retrain only when better
  # in 4 of 5 folds and on the held-back days); winners as paper books F3_<id> in the collector, never live.
  # Resumable: the Optuna journal and the ledger are on disk, a rerun the same night does the trials left.
  - name: pumpfun-factory
    description: pump.fun factory F3, PAPER, nightly; Optuna strategy search on realistic execution with a small wallet, LightGBM settings of the R2 labels, the factory paper books, reports/pumpfun_rt/factory.md
    schedule: "0 1 * * *"
    command: python -m lab.pumpfun_rt.factory
    env: {PYTHIA_PF_FACTORY_TRIALS: "300"}
    resources: {cpus: 3, memory: 8g}
    timeout: 150m
    lock: heavy
    lock_wait: 20m

  - name: pumpfun-rt-study
    description: real-time pump.fun lab, PAPER, daily; 22 rules and the pipeline strategies replayed, the bar, live readiness, capture, decision rows, X14 early/exit rows and Y9 select rows for the retrain
    schedule: "50 6 * * *"
    command: python -m lab.pumpfun_rt.study
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 2, memory: 8g}
    # 4h again (2026-10-29): the runtime grew 2,676 to 12,943 s in a week while the record filled up to its 14 days
    # (the 8h stopgap); now the model-free part of pass 2 replays while a second process runs pass 1 and the model half
    timeout: 4h
    lock: pumpfun-rt
    lock_wait: 10m

  - name: pumpfun-rt-retrain
    description: real-time pump.fun lab, daily retrain after the study; purged walk-forward per label and feature set, X14 early detection and exit policies, Y9 select models, models for the shadow books, the daily card
    depends_on: [pumpfun-rt-study]
    depends_within: 6h
    command: python -m lab.pumpfun_rt.retrain
    env_file: /etc/pythia/alerts.env
    resources: {cpus: 2, memory: 8g}
    timeout: 3h
    lock: pumpfun-rt
    lock_wait: 30m

  # Survey idea O9 (results/pumpfun_activity_prereg.md): the daily activity series from the
  # record, kept in reports/pumpfun_activity/series.csv after the record drops old days.
  # Forward only, nothing judged before 180 complete days. Added disabled; switch on
  # (enabled: true, then deploy_ops.sh) once lab.pumpfun_rt.activity is deployed.
  - name: pumpfun-activity
    description: pump.fun daily activity (creations, completions, migrations, curve SOL volume, traders, coverage), forward record for O9
    schedule: "15 6 * * *"
    command: python -m lab.pumpfun_rt.activity
    resources: {cpus: 1, memory: 4g}
    timeout: 30m
    lock: pumpfun-rt-activity

  - name: cs2-collect
    description: CS2 skins, Skinport snapshots and sales history, Steam prices for the watchlist (15 a run, rotating; a 429 cools Steam down 1 h doubling to 12 h; red when Steam is asked and gives no price)
    schedule: "12 * * * *"
    command: python -m lab.collect.cs2
    resources: {cpus: 1, memory: 4g}
    timeout: 40m
    replaces: pythia-cs2

  - name: cs2-run
    description: CS2 models, alerts, the play-money portfolio and the board, after the collector
    depends_on: [cs2-collect]
    depends_within: 2h
    command: python -m lab.cs2.run
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 4g}
    timeout: 15m
    replaces: pythia-cs2

  # New, no hand-written cron file before it. The source file is rebuilt once
  # a day (13:25 UTC on 2026-10-15); the 20:40 run only catches a late rebuild
  # and is a no-op once the day is stored.
  - name: cs2-trends
    description: CS2 Steam market, the daily price snapshot (csgotrader's public file), trends, trend alerts and the summary card
    schedule: "40 14,20 * * *"
    command: sh -c 'python -m lab.collect.cs2 --steam-market && python -m lab.cs2.trends'
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 3g}
    timeout: 20m

  - name: flow-collect
    description: flow data, Coinbase and Upbit BTC, every Upbit KRW market and its warning flags, USD/KRW, stablecoin supply, Deribit DVOL and 25-delta skew, continues from what is stored
    schedule: "40 0 * * *"
    command: python -m lab.collect.flow
    resources: {cpus: 1, memory: 1g}
    timeout: 1h

  # attention_wiki's page views (Wikimedia REST API, keyless, about 360 small
  # requests a run at most 4 a second, a User-Agent naming the public repo).
  - name: wiki-collect
    description: English Wikipedia page views of the coins' articles and their redirects (attention_wiki), continues from what is stored
    schedule: "50 0 * * *"
    command: python -m lab.collect.wiki
    resources: {cpus: 1, memory: 1g}
    timeout: 30m

  # D2: free data, collected around the clock, point in time (lab.collect.pit: every row with the
  # time it describes, when it was collected, when it became known, and whether it came from a
  # backfill). Keyless public APIs at polite rates; each first run is the backfill. Each writes
  # free/<source>/health.json, which the health check turns into a row per source (feeds, below).
  - name: free-deribit
    description: Deribit BTC and ETH DVOL hourly, ATM IV and 25-delta skew at 7, 30 and 90 days, put/call open interest
    schedule: "5 * * * *"
    command: python -m lab.collect.deribit_vol
    resources: {cpus: 1, memory: 1g}
    timeout: 20m
    alert: false

  - name: free-hyperliquid
    description: Hyperliquid funding, open interest and mark/oracle premium of the universe's coins, hourly, funding history continued
    schedule: "15 * * * *"
    command: python -m lab.collect.hyperliquid
    resources: {cpus: 1, memory: 1g}
    timeout: 30m
    alert: false

  # T12b: the listing and whole hourly funding history of every perp on Hyperliquid (about 230, live and
  # delisted) and Kraken Futures (every PF_ perpetual), for T12 (results/reachable_venues_t12_prereg.md).
  # Resumable: at most 500 Hyperliquid requests (one every 3 s, under its weight limit, at :35 so it never
  # meets free-hyperliquid's) and 120 Kraken requests (one a second) a run; the backfill takes about a day
  # of runs, then a run only appends. Data only, public endpoints, no key.
  - name: free-perps-all
    description: every perp's listing and hourly funding history on Hyperliquid and Kraken Futures, resumable backfill then appends
    schedule: "35 * * * *"
    command: python -m lab.collect.perps_all
    resources: {cpus: 1, memory: 1g}
    timeout: 45m
    alert: false

  - name: free-feargreed
    description: Crypto Fear and Greed index (alternative.me), daily, its whole history on the first run
    schedule: "20 0 * * *"
    command: python -m lab.collect.fear_greed
    resources: {cpus: 1, memory: 512m}
    timeout: 10m

  - name: free-macro
    description: US 2y and 10y yields and VIX (FRED), dollar index, gold and VIX (Yahoo), daily from 2017
    schedule: "40 0 * * *"
    command: python -m lab.collect.macro
    resources: {cpus: 1, memory: 512m}
    timeout: 15m

  # T10: the xStocks tokens the small books use (SPYx), the issuer's quote, multiplier, halt flag, proof of
  # reserves, oracle feeds and corporate actions (keyless public API, about 7 requests a token), point in time,
  # at the small books' 00:00 UTC decision and once more at noon; the premium report next to R10's series.
  - name: xstocks-collect
    description: T10 xStocks record of the small books' tokens (SPYx), quote, multiplier, proof of reserves, oracle feeds and corporate actions, point in time, and the premium to the underlying's last close (reports/xstocks)
    schedule: "0 0,12 * * *"
    command: python -m lab.collect.xstocks
    resources: {cpus: 1, memory: 1g}
    timeout: 10m

  - name: free-defillama
    description: DefiLlama stablecoin supply (all, USDT, USDC) and its daily change, DEX volume in total and on Solana, Solana TVL
    schedule: "20 1 * * *"
    command: python -m lab.collect.defillama
    resources: {cpus: 1, memory: 1g}
    timeout: 15m

  - name: book-depth
    description: T4 Binance USD-M bookDepth (30 s depth within 0.2 and 1 to 5 % of mid) of the lab's perps from 2023, checksummed, the new days first then the backfill (at most 60,000 files a run, resumable), and Binance's delisting and monitoring-tag announcements; refuses the backfill when the whole history would pass 40 GB
    schedule: "30 10 * * *"
    command: python -m lab.collect.book_depth
    resources: {cpus: 2, memory: 2g}
    timeout: 5h

  - name: etf-daily
    description: the lab's daily ETF closes (etf/daily) downloaded again after the US close, every symbol the ETF study, the small books, history and the briefing read; a failed symbol keeps its old file, no study
    schedule: "30 22 * * 1-5"
    command: python -m lab.collect.etf_daily
    resources: {cpus: 1, memory: 512m}
    timeout: 15m

  # EQ1 (research/lab/results/etf_books_eq1_prereg.md): ten long-term ETF paper books at 50 EUR (UCITS funds in EUR on
  # Xetra), each with a Trade Republic, a Scalable and an Interactive Brokers wallet at their stated costs, one close
  # late, the monthly top-up on its day. Right after etf-daily, whose closes it reads. Paper only, no engine signal.
  - name: paper-etf-books
    description: EXPERIMENT EQ1's ten ETF paper books at 50 EUR (UCITS funds in EUR, three brokers' costs) and their EUR report
    depends_on: [etf-daily]
    command: python -m lab.paper.etf_books
    resources: {cpus: 1, memory: 1g}
    timeout: 10m

  # Added disabled; switch on (enabled: true, then deploy_ops.sh) once the
  # module is deployed to /opt/pythia-lab and its command is confirmed.
  - name: pokemon
    description: Pokemon cards, price snapshot (sealed products too; a snapshot the timeout cut off the day before is finished first from its cursor), then studies, forecasts, the paper collection and card alerts; stale price sources are named, the job ends red when no source (TCGplayer, Cardmarket, TCGplayer dumps) has a price of the last 3 days
    schedule: "5 7 * * *"
    command: sh -c 'python -m lab.collect.pokemon --sealed && python -m lab.pokemon.daily'
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 2, memory: 6g}
    timeout: 2h
    replaces: pythia-pokemon

  # Polymarket (Y4, results/polymarket.md). PAPER ONLY: public read-only data, no wallet,
  # no key, no order. Added disabled; switch on (enabled: true, then deploy_ops.sh) once
  # lab/polymarket is deployed to /opt/pythia-lab. The daily run calls Claude Sonnet 5.5
  # through the engine's metered POST /api/ai/complete (Batches, budget enforced there,
  # about $0.30 a day at 300 markets); a refusal or an engine that is down only skips the
  # forecasts, the books still run.
  - name: polymarket-daily
    description: Polymarket PAPER books, snapshot of the open markets and books, settle, step, score, report and card (the Claude forecasts paused)
    schedule: "15 5 * * *"
    # without --forecast since 2026-10-29: the metered API has no credit (39 refused calls a day in the engine's
    # log); the Claude series is pre-registered and pauses, it is not replaced by another model
    command: python -m lab.polymarket.daily
    network: host
    env_file: [/etc/pythia/alerts.env, '/etc/pythia/discord.env?']
    resources: {cpus: 1, memory: 3g}
    timeout: 2h
    lock: polymarket
    lock_wait: 30m

  - name: polymarket-history
    description: Polymarket resolved markets and their price history, weekly, only what is new
    schedule: "30 1 * * 1"
    command: python -m lab.polymarket.collect --history
    resources: {cpus: 1, memory: 3g}
    timeout: 8h
    lock: polymarket-history

  - name: polymarket-study
    description: Polymarket study after the history, biases, the calibrated model against the market, the paper twin, the model the daily book uses
    depends_on: [polymarket-history]
    depends_within: 12h
    command: python -m lab.polymarket.study
    resources: {cpus: 4, memory: 10g}
    timeout: 4h
    lock: heavy
    lock_wait: 4h

  - name: retrain
    description: weekly retrain of the volatility model (M1), promoted only if better
    schedule: "0 5 * * 0"
    command: sh -c 'python -m lab.experiments.vol > /data/reports/vol_1h/run.log 2>&1'
    resources: {cpus: 4, memory: 8g}
    timeout: 3h
    lock: heavy
    lock_wait: 2h
    replaces: pythia-retrain

  - name: equities-studies
    description: equities studies refresh
    schedule: "0 23 * * 1-5"
    command: python -m lab.equities.run
    env_file: '/etc/pythia/alpaca-paper.env?'
    resources: {cpus: 2, memory: 6g}
    timeout: 3h
    lock: heavy
    lock_wait: 2h
    enabled: false

# Size and growth per dataset (paths under the data root). max_gb turns the
# dataset red in the health check; retention_days lets the prune job delete
# files older than that (by modification time, only those matching pattern).
# Datasets without retention_days are never deleted from. max_age_h turns it red
# when its newest file (by modification time) is older than that many hours.
datasets:
  - name: recorder-binance
    path: binance
    max_age_h: 3
    max_gb: 250
  - name: recorder-kraken
    path: kraken
    max_age_h: 3
    max_gb: 100
  - name: recorder-bybit
    path: bybit
    max_age_h: 3
    max_gb: 100
  - name: recorder-okx
    path: okx
    max_age_h: 3
    max_gb: 100
  - name: recorder-coinbase
    path: coinbase
    max_age_h: 3
    max_gb: 100
  - name: history
    path: hist
    max_age_h: 36
    max_gb: 300
  - name: lab-cache
    description: run caches and panels, rebuilt by the nightly jobs
    path: lab-cache
    max_gb: 80
  - name: models
    path: models
    max_age_h: 36
    max_gb: 20
  - name: paper
    path: paper
    max_age_h: 26
    max_gb: 5
  - name: reports
    description: dated report copies older than a year go; latest.* stay
    path: reports
    max_age_h: 6
    max_gb: 10
    retention_days: 365
    pattern: ["20??-??-??*.json", "20??-??-??*.md"]
  - name: signals
    path: signals
    max_age_h: 36
    max_gb: 2
    retention_days: 180
    pattern: ["20??-??-??.json"]
  - name: learn
    path: learn
    max_age_h: 36
    max_gb: 50
  - name: readiness
    description: the real money readiness record (one line a day) and the inflation cache; never deleted
    path: readiness
    max_age_h: 36
    max_gb: 1
  - name: recorder-binance-um
    path: binance_um
    max_age_h: 3
    max_gb: 100
  - name: spread
    path: spread
    max_age_h: 3
    max_gb: 20
  - name: factory
    description: the trial ledger and shadow books; never deleted
    path: factory
    max_gb: 5
  - name: cs2-snapshots
    description: hourly Skinport and Steam snapshots; the models read only cs2/daily, kept forever
    path: cs2
    max_age_h: 6
    max_gb: 40
    retention_days: 180
    pattern: ["[0-2][0-9][0-5][0-9].parquet"]
  - name: trending
    description: a snapshot every 15 minutes
    path: trending/snapshots
    max_age_h: 3
    max_gb: 10
    retention_days: 365
    pattern: ["*.parquet"]
  - name: listings
    path: listings
    max_age_h: 3
    max_gb: 2
  - name: candles
    description: C1's candle store (Binance REST fill, Kraken 1m, GeckoTerminal, Yahoo); kept forever
    path: candles
    max_age_h: 3
    max_gb: 20
  - name: ai
    description: the Claude API ledger, caps and the AI brief's predictions; never deleted
    path: ai
    max_gb: 1
  - name: flow
    description: daily flow data and the Deribit option snapshots; kept forever
    path: flow
    max_age_h: 36
    max_gb: 5
  - name: free
    description: the free data collectors of D2 (Deribit, Hyperliquid, DefiLlama, Fear and Greed, macro); kept forever
    path: free
    max_gb: 5
  - name: perps-all
    description: T12b's listing and hourly funding of every perp on Hyperliquid and Kraken Futures (free/perps_all, inside free; about 1 GB once backfilled, a few MB a month after); kept forever
    path: free/perps_all
    max_age_h: 3
    max_gb: 3
  - name: xstocks
    description: T10's xStocks record (free/xstocks, inside free), written at 00:00 and 12:00 UTC; kept forever
    path: free/xstocks
    max_age_h: 14
  - name: pumpfun-rt
    description: the real-time pump.fun record; the collector deletes whole days, oldest first, over PYTHIA_PF_BUDGET_GB (40)
    path: pumpfun_rt
    max_age_h: 3
    max_gb: 45
  - name: polymarket
    description: Polymarket resolved set, daily snapshots and books (the collector deletes book and snapshot days, oldest first, over PYTHIA_PM_BUDGET_GB, 6), the forecast ledgers and paper books (never deleted)
    path: polymarket
    max_age_h: 36
    max_gb: 8
  - name: job-runs
    description: the runner's own run records, by month
    path: _ops/runs
    max_gb: 1
    retention_days: 400
    pattern: ["*.jsonl"]
  - name: etf
    description: daily ETF closes the briefing and the small books read
    path: etf/daily
    max_gb: 1
    max_age_h: 96
  - name: pokemon
    path: pokemon
    max_gb: 10
    max_age_h: 36
  - name: book-depth
    description: T4 Binance bookDepth snapshots and hours of the lab's perps from 2023 and the delisting table; about 35 GB once backfilled, about 15 GB a year after
    path: book_depth
    max_gb: 45
    max_age_h: 48

# Free data sources the health check watches (jobs.py checks, one "feed <name>" row each): the
# status file the collector writes after every run, how old its last run and the newest value
# of each of its tables may be (max_age), how many missing steps in the last 7 days are
# tolerated (max_gaps), and the job (no row while that job is disabled).
feeds:
  - name: deribit
    job: free-deribit
    status: free/deribit/health.json
    max_age: 4h
    max_gaps: 2
  - name: hyperliquid
    job: free-hyperliquid
    status: free/hyperliquid/health.json
    max_age: 3h
    max_gaps: 2
  - name: perps-all
    job: free-perps-all
    status: free/perps_all/health.json
    max_age: 1d
    max_gaps: 3
  - name: fear-greed
    job: free-feargreed
    status: free/fear_greed/health.json
    max_age: 2d
  - name: macro
    job: free-macro
    status: free/macro/health.json
    max_age: 6d
    max_gaps: 2
  - name: defillama
    job: free-defillama
    status: free/defillama/health.json
    max_age: 3d
    max_gaps: 1
  - name: xstocks
    job: xstocks-collect
    status: free/xstocks/health.json
    max_age: 14h
    max_gaps: 1
  - name: book-depth
    job: book-depth
    status: book_depth/health.json
    max_age: 3d
    max_gaps: 30

# The state that cannot be rebuilt from market data. Paths are under the
# data root. Archives go to dest (outside the data root) as
# pythia-state-<UTC time>.tar.gz with a .sha256 and a .json manifest, mode 600.
backup:
  dest: /srv/pythia-backup
  keep_daily: 7
  keep_weekly: 4
  # The off-server copy (research/sync-to-pc.sh, its receipt <dest>/offsite.json) may lag the newest archive this long
  offsite_max_age: 1d
  include:
    - autopilot
    - engine
    - autopilot-safe
    - models
    - paper
    - cs2/paper
    - signals
    - learn
    - readiness
    - factory
    - ai
    - live
    - pumpfun_rt/categories
    - pumpfun_rt/factory
    - reports/pumpfun_rt/live_settings.json
    - discord/channels.json
    - polymarket/forecasts
    - polymarket/paper
    - polymarket/model
    - reports/forward/evidence.json
    - reports/forward/backtest
    # D2's snapshots without a source history (the option surface, Hyperliquid's contexts)
    - free/deribit/surface.parquet
    - free/hyperliquid/ctx.parquet
  # By file or folder name: caches the jobs rebuild (the zoo's panels, the
  # learning loop's sweep run caches) and the engines' own rolling state.json.bak-* copies stay out of the archive.
  exclude: ["*.tmp", "*.lock", "*.part", "_data", "sweep", "*.bak-*"]
