services:
  recorder:
    build: .
    image: pythia-recorder
    container_name: pythia-recorder
    restart: unless-stopped
    stop_grace_period: 30s      # time to flush buffers on shutdown
    volumes:
      - /srv/pythia-data:/data
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
