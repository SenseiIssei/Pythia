# The engine, the server, the command line and the desktop app.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "src-tauri/**"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "src-tauri/**"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The desktop crate embeds the UI folder at build time; an empty one will do here.
      - run: mkdir -p dist
        shell: bash
      - run: cargo test --workspace --locked

  msrv:
    name: Oldest supported Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - id: msrv
        run: echo "rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' server/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked -p pythia-server -p pythia-cli
