# Builds the downloads for a release: the desktop app as an installer for
# Windows, macOS and Linux, and the command line (`pythia` plus the headless
# engine `pythia-server`) as an archive per platform.
#
# Runs when a version tag (v0.5.1, ...) is pushed, or by hand for an existing
# tag. The release notes come from docs/release-notes-<version>.md.
#
# The builds are not code-signed: Windows SmartScreen asks once ("More info",
# "Run anyway"), and macOS wants a right click on the app and "Open" the first
# time. The release notes say so.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.5.1"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes="docs/release-notes-${version}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          elif [ -f "$notes" ]; then
            gh release create "$TAG" --title "Pythia ${version}" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" --title "Pythia ${version}" --generate-notes --verify-tag
          fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            out: target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            out: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf pkg-config
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: npm ci --no-audit --no-fund
      - name: Build the installer
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.out }} --clobber

  cli:
    name: CLI (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build pythia and pythia-server
        run: cargo build --release --locked --target ${{ matrix.target }} -p pythia-cli -p pythia-server
      - name: Pack
        shell: bash
        run: |
          name="pythia-cli-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/pythia$ext" "target/${{ matrix.target }}/release/pythia-server$ext" "dist/$name/"
          cp LICENSE .env.example cli/README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber
