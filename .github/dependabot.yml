# One grouped pull request per ecosystem and month, plus GitHub's security
# updates. research/ is left to the lab.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      rust: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # Comes in through Tauri's GTK 3 stack, which pins 0.18. Nothing here can
      # raise it (the security update fails with "security_update_not_possible").
      - dependency-name: glib
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
